[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-translator"
version = "0.1.0"
description = "Structure-aware English document translation into Indian languages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [\n    "python-docx>=1.1",\n]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
